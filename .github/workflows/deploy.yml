<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォートナイト速報 | 最速アプデ・リーク情報局</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: white; margin: 0; padding: 0; }
        header { background: linear-gradient(90deg, #8224e3, #4a148c); padding: 20px; text-align: center; font-size: 24px; font-weight: bold; border-bottom: 4px solid #f9d71c; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .news-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .main-content, .sidebar { background: #1e1e1e; padding: 15px; border-radius: 10px; }
        h2 { color: #f9d71c; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .shop-banner { width: 100%; height: 200px; background: #333; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border-radius: 10px; border: 2px dashed #555; }
        .tweet-box { margin-bottom: 20px; }
        footer { text-align: center; padding: 20px; font-size: 12px; color: #777; }
        @media (max-width: 768px) { .news-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>⚡ FORTNITE UPDATE NEWS ⚡</header>

<div class="container">
    <div class="shop-banner">
        <!-- ここに本日のアイテムショップの画像を貼る（API連携で自動化可能） -->
        <p>【本日のアイテムショップ画像（更新中）】</p>
    </div>

    <div class="news-grid">
        <div class="main-content">
            <h2>最新アプデ・パッチノート速報</h2>
            <div id="latest-news">
                <p>現在、最新のデータを読み込んでいます...</p>
                <!-- Twitter（X）の埋め込みタイムライン -->
                <a class="twitter-timeline" data-height="600" data-theme="dark" href="https://twitter.com/FortniteJP?ref_src=twsrc%5Etfw">Tweets by FortniteJP</a> <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
            </div>
        </div>

        <div class="sidebar">
            <h2>リーク情報 (海外)</h2>
            <!-- 海外の超速報リーカーのツイートを表示させる -->
            <a class="twitter-timeline" data-height="600" data-theme="dark" href="https://twitter.com/HYPEX?ref_src=twsrc%5Etfw">Tweets by HYPEX</a> <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
        </div>
    </div>
</div>

<footer>
    &copy; 2024 フォートナイト速報ファンサイト. All Rights Reserved.
</footer>

</body>
</html>async function getFortniteNews() {
    const response = await fetch('https://fortnite-api.com/v2/news');
    const data = await response.json();
    const newsItems = data.data.br.motds; // バトルロイヤルのニュース

    const container = document.getElementById('news-container');
    newsItems.forEach(item => {
        const html = `
            <div class="news-card">
                <img src="${item.image}" alt="${item.title}">
                <h3>${item.title}</h3>
                <p>${item.body}</p>
            </div>
        `;
        container.innerHTML += html;
    });
}
getFortniteNews();

https://fortnite-api.com/v2/news
